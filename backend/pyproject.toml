[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datapilot-backend"
version = "0.1.0"
description = "Local multi-agent PostgreSQL analytics backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "sqlglot>=26,<30",
  "openai>=1.58,<3",
  "langgraph>=0.2,<2",
  "aiosqlite>=0.20,<1",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
